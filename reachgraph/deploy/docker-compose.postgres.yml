# The Phase 1 persistent graph store's only local infrastructure dependency:
# Postgres for GUAC's ent backend. GUAC itself (guacgql) is built from
# source by setup-guac.sh rather than vendored here — see that script and
# ../README.md for why.
#
# Reference only: setup-guac.sh drives Postgres with plain `docker run`/
# `docker start` instead of `docker compose up`, since rootless podman's
# compose shim couldn't reach its own socket in the environment this was
# built in. If your Docker setup doesn't hit that, `docker compose -f
# docker-compose.postgres.yml up -d` does the same thing this file describes.
services:
  guac-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: guac-postgres
    environment:
      POSTGRES_USER: guac
      POSTGRES_PASSWORD: guac
      POSTGRES_DB: guac
    ports:
      - "5432:5432"
    volumes:
      - guac-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guac"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guac-postgres-data:
